<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nic Piraino — Hardware Engineering & System Design. Embedded systems, PCB design, audio electronics, and full-stack engineering." />

    <!-- Open Graph -->

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Nic Piraino | Hardware Engineering & System Design" />
    <meta name="twitter:description" content="Embedded systems, PCB design, audio electronics, and full-stack engineering." />
    <meta name="twitter:image"       content="https://nicpiraino.com/Remastered%20Photos/Kelowna%20Mountains.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Material Symbols is requested with &icon_names=, which makes Google serve a
      subset containing only the icons this site renders. Without it the full
      variable icon font ships on EVERY page load: measured at 5,220 KB, more
      than ten times the site's entire JavaScript payload.

      If you add a new <span class="material-symbols-rounded">name</span>, add
      the name to this list too, or it renders as its literal ligature text.
      Regenerate by scanning src/ for icon literals and `icon:` data fields.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=accessibility_new,add,album,arrow_back,bug_report,build_circle,center_focus_strong,chevron_left,chevron_right,close,code,computer,copyright,dark_mode,electric_bolt,emoji_events,fit_screen,flight,fullscreen,fullscreen_exit,gavel,handyman,hub,library_music,light_mode,memory,military_tech,open_in_full,open_in_new,pause,person,photo_camera,photo_library,play_arrow,play_circle,progress_activity,radio_button_checked,refresh,remove,search,settings,speaker,stars,sync,thermostat,upload_file,videocam_off,visibility,visibility_off,zoom_in&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Sync theme before React mounts — prevents flash of wrong theme -->
    <script>
      try {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
