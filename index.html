<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nic Piraino: Hardware Engineering &amp; System Design. Embedded systems, PCB design, audio electronics, and full-stack engineering." />

    <!-- The site shipped with no favicon and no icon link, so every page load
         requested /favicon.ico and took a 404, and the browser tab was blank.
         Declaring the icon explicitly both fixes the tab and stops the implicit
         /favicon.ico request. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Nic Piraino | Hardware Engineering & System Design</title>

    <!-- Open Graph -->
    <!-- Canonical + og:url. usePageMeta rewrites both per route; these are the
         defaults for the home page and for any crawler that does not run JS. -->
    <link rel="canonical" href="https://nicpiraino.com/" />
    <meta property="og:url"         content="https://nicpiraino.com/" />
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Nic Piraino | Hardware Engineering & System Design" />
    <meta property="og:description" content="Embedded systems, PCB design, audio electronics, and full-stack engineering." />
    <meta property="og:image"       content="https://nicpiraino.com/Remastered%20Photos/display/Kelowna%20Mountains.jpg" />
    <meta property="og:image:alt"   content="Kelowna Mountains, photography by Nic Piraino" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Nic Piraino | Hardware Engineering & System Design" />
    <meta name="twitter:description" content="Embedded systems, PCB design, audio electronics, and full-stack engineering." />
    <meta name="twitter:image"       content="https://nicpiraino.com/Remastered%20Photos/display/Kelowna%20Mountains.jpg" />
    <!--
      Fonts are self-hosted from /fonts. There is no preconnect here any more
      because there is no third origin to connect to: the @font-face rules live
      in the site's own stylesheet, so the files are same-origin and can be
      preloaded from the HTML instead of being discovered two round trips later.

      Two text faces are preloaded, both needed for first paint: Exo 2 (body
      copy at 400, and every other weight the site uses -- the file is a
      variable font, one download covers 100 through 900, so there is no
      separate UI-weight file to preload any more) and Playfair 700 for
      headings. Material Symbols is deliberately NOT preloaded even though it
      is the largest file at 67 KB -- icons are boxed at 1em in index.css, so a
      late icon font cannot shift the layout, and putting it ahead of the text
      would trade a visible win for an invisible one.

      crossorigin is required on font preloads even for same-origin files:
      fonts are always fetched in anonymous CORS mode, and without it the
      browser downloads the file twice.

      If you add a new <span class="material-symbols-rounded">name</span>, the
      subset in public/fonts will not contain it and it renders as its literal
      ligature text. See public/fonts/LICENSES.txt for how to regenerate.
    -->
    <link rel="preload" href="/fonts/exo2-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- schema.org Person. This is a name-based domain, so the highest-value
         structured data is telling search engines that "Nic Piraino" is a
         person and that these external profiles are the same identity
         (sameAs) -- that is what lets a name search resolve to this site.

         NOTE ON CSP: script-src is 'self' with no unsafe-inline, but a block
         with a non-JavaScript type is a DATA block, not executable script, so
         CSP does not apply to it and this is not an inline-script violation.
         Verified in production with zero CSP reports. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Nic Piraino",
      "url": "https://nicpiraino.com/",
      "email": "mailto:nic.piraino2005@gmail.com",
      "jobTitle": "Engineering Student",
      "description": "Hardware engineering and system design: embedded systems, PCB design, audio electronics, and full-stack engineering.",
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "University of British Columbia Okanagan"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Kelowna",
        "addressRegion": "BC",
        "addressCountry": "CA"
      },
      "knowsAbout": [
        "Hardware Engineering",
        "PCB Design",
        "Embedded Systems",
        "Motor Control",
        "Computer Vision",
        "Audio Preservation",
        "Photography"
      ],
      "sameAs": [
        "https://github.com/NiccTM",
        "https://www.linkedin.com/in/nic-piraino/",
        "https://www.discogs.com/user/NiccTM"
      ]
    }
    </script>
  </head>
  <body>
    <!-- Sync theme before React mounts -- prevents flash of wrong theme -->
    <script src="/theme-init.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
